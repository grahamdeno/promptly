# Promptly. `xcodegen generate` makes Promptly.xcodeproj (not checked in).
name: Promptly
options:
  bundleIdPrefix: com.grahamdeno
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 7MHDTK68M2
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Promptly:
    type: application
    platform: iOS
    sources:
      - App/Promptly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.promptly
        CODE_SIGN_ENTITLEMENTS: Config/Promptly.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Promptly
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Promptly reads your calendars to ring before each meeting. It never changes your calendar, and nothing leaves this iPhone."
        INFOPLIST_KEY_NSAlarmKitUsageDescription: "Promptly rings before your meetings, even in Silent and Focus, so you don't miss them."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  PromptlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/PromptlyTests
    dependencies:
      - target: Promptly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.promptly.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Promptly:
    build:
      targets:
        Promptly: all
    test:
      targets:
        - PromptlyTests
