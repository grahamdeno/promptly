# Promptly. `xcodegen generate` makes Promptly.xcodeproj (not checked in).
name: Promptly
options:
  bundleIdPrefix: com.grahamdeno
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 7MHDTK68M2
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Promptly:
    type: application
    platform: iOS
    sources:
      - App/Promptly
      - App/Shared
    dependencies:
      - target: PromptlyWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.promptly
        CODE_SIGN_ENTITLEMENTS: Config/Promptly.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Pop In
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Pop In reads your calendars to ring before each meeting. It never changes your calendar, and nothing leaves this iPhone."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Coral AppIcon-Unicorn AppIcon-Fortune AppIcon-Moon AppIcon-Grenade AppIcon-Snowball AppIcon-Ornament AppIcon-Pumpkin
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  PromptlyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - App/PromptlyWidgets
      - App/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.promptly.widgets
        CODE_SIGN_ENTITLEMENTS: Config/PromptlyWidgets.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Widgets-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Pop In
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  PromptlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/PromptlyTests
    dependencies:
      - target: Promptly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.promptly.tests
        GENERATE_INFOPLIST_FILE: YES
  PromptlyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/PromptlyUITests
    dependencies:
      - target: Promptly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.promptly.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Promptly
schemes:
  Screenshots:
    build:
      targets:
        Promptly: all
        PromptlyUITests: [test]
    test:
      targets:
        - PromptlyUITests
  Promptly:
    build:
      targets:
        Promptly: all
    test:
      targets:
        - PromptlyTests
