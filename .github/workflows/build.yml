name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Read-only guard
        # Promptly never writes to the calendar and never uses the network.
        run: |
          python3 -I scripts/read_only_guard.py selftest
          python3 -I scripts/read_only_guard.py check

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo '::error::Xcode 26 is unavailable'; exit 1; fi
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available iPhone | grep -Eo '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -1)
          if [ -z "$UDID" ]; then echo '::error::No available iPhone simulator'; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          xcodebuild test \
            -project Promptly.xcodeproj \
            -scheme Promptly \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath ci-artifacts/Promptly.xcresult \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            > ci-artifacts/build.log 2>&1 \
            || { grep -E "error:|failed" ci-artifacts/build.log | sort -u | head -30 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          grep -E "Test Suite 'All tests'|Executed|\*\* TEST" ci-artifacts/build.log | tail -5

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptly-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 7
          if-no-files-found: warn
